name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::068648884098:role/github-actions-terraform-lab
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform plan